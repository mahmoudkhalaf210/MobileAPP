# ============================================================
# Nginx WebSocket configuration for gogos.site
# Apply inside your existing server { } block for gogos.site
# ============================================================
#
# The two /ws/ locations below add the WebSocket upgrade headers
# that nginx strips by default. Without them the backend receives
# a plain HTTP request and returns HTTP 400.
#
# Merge these location blocks into your current site config.
# ============================================================

server {
    listen 443 ssl;
    server_name gogos.site;

    # --- your existing SSL, root, and other config here ---

    # ── Location WebSocket: driver location ──────────────────
    location /ws/location {
        proxy_pass         http://127.0.0.1:5000;   # change port to match your .NET app
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived WS connections alive
        proxy_send_timeout 3600s;
    }

    # ── Location WebSocket: real-time orders ─────────────────
    location /ws/orders {
        proxy_pass         http://127.0.0.1:5000;   # same backend port
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── All other API traffic ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Redirect plain HTTP → HTTPS (nginx handles this, not .NET)
server {
    listen 80;
    server_name gogos.site;
    return 301 https://$host$request_uri;
}
